name: Verify Google Cloud connection
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Google Cloud project ID
        type: string
        required: true
      project_number:
        description: Google Cloud project number
        type: string
        required: true
      enable_resource_manager:
        description: Enable Cloud Resource Manager API in this project
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_PROJECT: ${{ inputs.project_id }}
      TARGET_NUMBER: ${{ inputs.project_number }}
    steps:
      - name: Validate project identifiers
        run: |
          [[ "$TARGET_PROJECT" =~ ^[a-z][a-z0-9-]{4,61}[a-z0-9]$ ]]
          [[ "$TARGET_NUMBER" =~ ^[0-9]{6,20}$ ]]
      - name: Authenticate to the chosen project
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/translation-actions/providers/github
          service_account: translation-vertex@${{ inputs.project_id }}.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable Cloud Resource Manager API when explicitly requested
        if: ${{ inputs.enable_resource_manager }}
        run: gcloud services enable cloudresourcemanager.googleapis.com --project="$TARGET_PROJECT" --quiet
      - name: Check project access without modifying settings
        run: |
          set -euo pipefail
          gcloud projects describe "$TARGET_PROJECT" --format='value(projectId)'
          gcloud services list --enabled --project="$TARGET_PROJECT" --filter='config.name:aiplatform.googleapis.com' --format='value(config.name)'
      - name: Check whether billing is linked
        run: |
          if gcloud billing projects describe "$TARGET_PROJECT" --format=json > "$RUNNER_TEMP/billing.json" 2> "$RUNNER_TEMP/billing-error"; then
            python -c 'import json, os; p = os.path.join(os.environ["RUNNER_TEMP"], "billing.json"); print("Billing enabled:", json.load(open(p)).get("billingEnabled", False))'
          else
            echo "Billing status could not be read with this identity."
          fi
