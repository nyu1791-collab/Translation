name: Connect VOICEBOX to Vertex
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Google Cloud project ID
        type: string
        default: project-fdadb4dd-cb77-4270-9cd
      project_number:
        description: Google Cloud project number
        type: string
        default: '793547679344'
permissions:
  contents: read
  id-token: write
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate as Translation setup identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/translation-actions/providers/github
          service_account: translation-vertex@${{ inputs.project_id }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Set up the VOICEBOX identity
        env:
          GOOGLE_CLOUD_PROJECT: ${{ inputs.project_id }}
        run: bash scripts/setup_voicebox_vertex_wif.sh
