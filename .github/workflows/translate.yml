name: Translation video
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public video URL (visible in workflow history)
        type: string
        required: true
      source_language:
        description: BCP-47 language hint; blank detects automatically
        type: string
        default: ''
      target_language:
        description: Target language
        type: string
        default: 日本語
      start_seconds:
        description: Start in seconds
        type: string
        default: '0'
      end_seconds:
        description: End in seconds; blank means end of video
        type: string
        default: ''
      thinking:
        description: Translation reasoning level
        type: choice
        options: [MINIMAL, LOW, MEDIUM, HIGH]
        default: MEDIUM
      workers:
        description: Maximum concurrent audio windows
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
        default: '6'
      project_id:
        description: Registered Google Cloud project ID; blank uses the default
        type: string
        default: ''
      bilingual:
        description: Show the source text beneath the translation
        type: boolean
        default: false
      subtitles_only:
        description: Produce subtitle files without video rendering
        type: boolean
        default: false
      resume_run_id:
        description: Previous run ID whose private model checkpoints should be reused
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_LANGUAGE: ${{ inputs.source_language }}
      TARGET_LANGUAGE: ${{ inputs.target_language }}
      START_SECONDS: ${{ inputs.start_seconds }}
      END_SECONDS: ${{ inputs.end_seconds }}
      THINKING: ${{ inputs.thinking }}
      WORKERS: ${{ inputs.workers }}
      BILINGUAL: ${{ inputs.bilingual }}
      SUBTITLES_ONLY: ${{ inputs.subtitles_only }}
      STORE_REPO: ${{ vars.TRANSLATION_STORAGE_REPO || 'nyu1791-collab/ai-model-workers' }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm private output store access before processing
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Register TRANSLATION_STORAGE_TOKEN for the private output repository.' >&2; exit 1; }
          test "$(gh api "repos/$STORE_REPO" --jq '.private == true and .permissions.push == true')" = true || { echo 'The output repository must be private and writable by the configured token.' >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          uv sync --locked --no-dev
      - name: Select the project's Vertex identity
        id: project
        env:
          TRANSLATION_REQUESTED_PROJECT: ${{ inputs.project_id }}
          TRANSLATION_DEFAULT_PROJECT: ${{ vars.TRANSLATION_PROJECT_ID }}
          TRANSLATION_PROJECTS_JSON: ${{ vars.TRANSLATION_PROJECTS }}
          TRANSLATION_LEGACY_PROVIDER: ${{ vars.TRANSLATION_WIF_PROVIDER }}
          TRANSLATION_LEGACY_ACCOUNT: ${{ vars.TRANSLATION_SERVICE_ACCOUNT }}
        run: uv run --no-sync python -m translation.project_config
      - name: Connect Vertex with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.project.outputs.provider }}
          service_account: ${{ steps.project.outputs.service_account }}
          create_credentials_file: true
      - name: Restore private model checkpoints
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_STORAGE_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          test "$(gh api "repos/$STORE_REPO" --jq .private)" = true
          gh release download "translation-checkpoints-$RESUME_RUN_ID" --repo "$STORE_REPO" --pattern translation-checkpoints.zip --dir "$RUNNER_TEMP"
          python - <<'PY'
          import os, pathlib, re, zipfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          target = temp / 'translation-output' / 'cache'
          target.mkdir(parents=True, exist_ok=True, mode=0o700)
          with zipfile.ZipFile(temp / 'translation-checkpoints.zip') as bundle:
              items = bundle.infolist()
              if len(items) > 10000 or sum(item.file_size for item in items) > 256 * 1024 * 1024:
                  raise ValueError('Checkpoint archive exceeds size limit')
              names = set()
              for item in items:
                  if not re.fullmatch(r'cache/(?:[0-9a-f]{64}\.json|request-usage\.jsonl)', item.filename):
                      continue
                  if item.filename in names or item.file_size > 32 * 1024 * 1024:
                      raise ValueError('Invalid checkpoint archive')
                  names.add(item.filename)
                  (target / pathlib.PurePosixPath(item.filename).name).write_bytes(bundle.read(item))
          PY
      - name: Transcribe, translate and render
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          GOOGLE_CLOUD_PROJECT: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          args=("$SOURCE_URL" --output "$RUNNER_TEMP/translation-output" --config config.example.json --project "$GOOGLE_CLOUD_PROJECT" --target-language "$TARGET_LANGUAGE" --start "$START_SECONDS" --thinking "$THINKING" --workers "$WORKERS")
          if [ -n "$SOURCE_LANGUAGE" ]; then args+=(--source-language "$SOURCE_LANGUAGE"); fi
          if [ -n "$END_SECONDS" ]; then args+=(--end "$END_SECONDS"); fi
          if [ "$BILINGUAL" = true ]; then args+=(--bilingual); fi
          if [ "$SUBTITLES_ONLY" = true ]; then args+=(--subtitles-only); fi
          uv run --no-sync python -m translation "${args[@]}"
      - name: Preserve model checkpoints privately
        if: always() && steps.project.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/translation-output"
          if [ ! -d "$root/cache" ]; then exit 0; fi
          test -n "$STORE_REPO" && test -n "$GH_TOKEN"
          test "$(gh api "repos/$STORE_REPO" --jq .private)" = true
          python - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'translation-output'
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'translation-checkpoints.zip'
          with zipfile.ZipFile(dest, 'w', compression=zipfile.ZIP_DEFLATED) as bundle:
              for path in (root / 'cache').glob('*.json*'):
                  bundle.write(path, path.relative_to(root))
              for name in ('source-identity.json', 'run-state.json'):
                  path = root / name
                  if path.is_file(): bundle.write(path, name)
          PY
          gh release create "translation-checkpoints-$GITHUB_RUN_ID" "$RUNNER_TEMP/translation-checkpoints.zip" --repo "$STORE_REPO" --latest=false --notes 'Private model checkpoints and usage records.'
      - name: Save output in the private results repository
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STORE_REPO" && test -n "$GH_TOKEN"
          test "$(gh api "repos/$STORE_REPO" --jq .private)" = true
          python - <<'PY'
          import json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'translation-output'
          manifest = json.loads((root / 'manifest.json').read_text())
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'result.zip', 'w', allowZip64=True) as bundle:
              for name in ['manifest.json', *manifest['files']]:
                  bundle.write(root / name, name)
          PY
          gh release create "translation-result-$GITHUB_RUN_ID" "$RUNNER_TEMP/result.zip" --repo "$STORE_REPO" --latest=false --notes 'Private translated subtitle video and editable subtitles.'
